---
- name: Refresh Homebrew metadata for an explicit update
  ansible.builtin.command: /opt/homebrew/bin/brew update
  changed_when: true
  when: update_packages | bool

- name: Ensure declared Homebrew taps exist
  community.general.homebrew_tap:
    name: "{{ homebrew_taps }}"
    state: present

- name: Validate declared packages before installing them
  ansible.builtin.script:
    cmd: >-
      scripts/validate_packages.py
      {{ {'formulae': homebrew_formulae, 'casks': homebrew_casks} | to_json | quote }}
    executable: "{{ ansible_facts.python.executable }}"
  register: package_validation
  changed_when: false
  check_mode: false

- name: Report package validation
  ansible.builtin.debug:
    msg: "{{ package_validation.stdout_lines }}"

- name: Ensure declared formulae are installed
  community.general.homebrew:
    name: "{{ homebrew_formulae }}"
    state: "{{ 'latest' if update_packages | bool else 'present' }}"
    force_formula: true
  when: homebrew_formulae | length > 0

- name: Read installed cask identifiers
  ansible.builtin.command: /opt/homebrew/bin/brew list --cask
  register: installed_casks
  changed_when: false
  check_mode: false

- name: Request an optional password for cask installers
  ansible.builtin.pause:
    prompt: "Admin password for cask installers (Enter to skip; never saved in this repo)"
    echo: false
  register: cask_sudo_prompt
  no_log: true
  when:
    - not ansible_check_mode
    - homebrew_sudo_password is not defined
    - homebrew_casks | length > 0
    - >-
      update_packages | bool or
      (homebrew_casks | map('regex_replace', '^.*/', '') | difference(installed_casks.stdout_lines) | length > 0)

- name: Ensure declared casks are installed
  community.general.homebrew_cask:
    name: "{{ homebrew_casks }}"
    state: "{{ 'latest' if update_packages | bool else 'present' }}"
    sudo_password: "{{ homebrew_sudo_password | default(cask_sudo_prompt.user_input | default(omit)) }}"
  when: homebrew_casks | length > 0

- name: Report applications requiring manual resolution
  ansible.builtin.debug:
    msg: "MANUAL ACTION REQUIRED — {{ item.name }}: {{ item.reason }}"
  loop: "{{ manual_applications }}"
  loop_control:
    label: "{{ item.name }}"
