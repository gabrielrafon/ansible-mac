---
- name: Require the target desktop session for appearance changes
  ansible.builtin.assert:
    that: console_user.stdout == target_user
    fail_msg: Log into the target desktop or disable configure_ui.

- name: Inspect requested wallpaper
  ansible.builtin.stat:
    path: "{{ target_home }}/.config/wallpapers/{{ wallpaper_file }}"
  register: wallpaper_source

- name: Report missing wallpaper
  ansible.builtin.debug:
    msg: "MANUAL ACTION REQUIRED — wallpaper not found: {{ target_home }}/.config/wallpapers/{{ wallpaper_file }}"
  when: not wallpaper_source.stat.exists

- name: Read current wallpaper on desktop one
  ansible.builtin.command:
    argv:
      - /usr/bin/osascript
      - -e
      - tell application "System Events" to get picture of desktop 1
  register: wallpaper_current
  changed_when: false
  check_mode: false
  when: wallpaper_source.stat.exists

- name: Apply wallpaper only when different
  vars:
    wallpaper_path: "{{ wallpaper_source.stat.lnk_source | default(wallpaper_source.stat.path | default('')) }}"
  ansible.builtin.command:
    argv:
      - /usr/bin/osascript
      - -e
      - >-
        tell application "System Events" to set picture of desktop 1 to
        {{ wallpaper_path | to_json }}
  when:
    - wallpaper_source.stat.exists
    - wallpaper_current.stdout | default('') != wallpaper_path
  changed_when: true

- name: Enable Dark Mode
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleInterfaceStyle
    value: Dark
    type: string
