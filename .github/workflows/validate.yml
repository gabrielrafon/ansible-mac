---
name: Validate configuration
"on":
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Stow for isolated regression tests
        run: sudo apt-get update && sudo apt-get install -y stow
      - name: Install pinned tooling
        run: MAC_SETUP_PYTHON="$(command -v python)" make deps
      - name: Validate configuration and scripts
        run: make lint
      - name: Test conflict protection and repeated runs
        run: make test
